[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "henrytooth-difffocus"
version = "0.1.0"
description = "版本差异按语义分类，格式噪音单独归组"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "henrytooth" }]
keywords = ["diff", "review", "version-control", "semantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/henrytooth/difffocus"
Repository = "https://github.com/henrytooth/difffocus"
Issues = "https://github.com/henrytooth/difffocus/issues"

[project.scripts]
difffocus = "difffocus:main"

[tool.setuptools]
py-modules = ["difffocus"]
